<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Factory Pulse · MCP Chat</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <span class="eyebrow">Factory Pulse</span>
          <h1>MCP Assistant</h1>
        </div>
        <button id="new-chat" class="secondary" type="button">Новый диалог</button>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <div class="avatar">FP</div>
          <div class="bubble">Здравствуйте! Спросите меня о данных, доступных через MCP.</div>
        </article>
      </section>

      <section id="activity" class="activity" hidden></section>

      <form id="chat-form">
        <label class="sr-only" for="prompt">Сообщение</label>
        <textarea
          id="prompt"
          rows="1"
          maxlength="10000"
          placeholder="Например: во сколько пришёл сотрудник tab-21 28 августа 2026?"
          required
        ></textarea>
        <button id="send" type="submit">Отправить</button>
      </form>

      <details class="settings">
        <summary>Настройки подключения</summary>
        <label>
          X-Client-Token (если включён на сервере)
          <input id="client-token" type="password" autocomplete="off" />
        </label>
      </details>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
